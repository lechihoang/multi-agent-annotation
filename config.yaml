# =============================================================================
# DREAM: Debate-based RElevance Assessment with Multi-agents
# Based on: arXiv:2602.06526 - Completing Missing Annotation
#
# Prompt design adapted from paper for Vietnamese complaint detection.
# Output uses Pydantic (not JSON) for structured parsing.
# =============================================================================

# ---------------------------------------------------------------------------
# LLM Provider (NVIDIA NIM - compatible with OpenAI SDK)
# ---------------------------------------------------------------------------
nvidia:
  model: "meta/llama-3.3-70b-instruct"
  base_url: "https://integrate.api.nvidia.com/v1"
  temperature: 0.0  # DREAM uses temperature=0.0 for deterministic output
  top_p: 0.7
  max_tokens: 2048
  stream: false
  max_retries: 5
  rate_limit: 40  # requests per minute

# ---------------------------------------------------------------------------
# Task Definition
# ---------------------------------------------------------------------------
task:
  name: "complaint_detection"
  text_column: "review"
  label_column: "label"

  labels:
    # viOCD Paper (Section 3.1) - Định nghĩa chính xác:
    # Nhãn 1 (PHÀN NÀN): Thể hiện sự không hài lòng giữa thực tế và kỳ vọng,
    #                      thường kèm theo mong muốn được giải quyết. Có thể bao gồm cảnh báo,
    #                      đe dọa, đề xuất, hoặc lời khuyên. PHẢI CÓ MỤC ĐÍCH XÂY DỰNG.
    # Nhãn 0 (KHÔNG PHÀN NÀN): Khen ngợi, ca ngợi, thể hiện sự hài lòng,
    #                          HOẶC insult/chửi mắng không có mục đích xây dựng.
    "0": "Không phàn nàn — Khen ngợi, ca ngợi, hài lòng, HOẶC insult/chửi mắng không có mục đích xây dựng."
    "1": "Phàn nàn — Sự không hài lòng thực tế vs kỳ vọng + mong muốn giải quyết + mục đích xây dựng (đề xuất/cảnh báo)."

# ---------------------------------------------------------------------------
# DREAM Configuration (Multi-Agent Debate)
# ---------------------------------------------------------------------------
dream:
  enabled: true

  # ── Debate Parameters ─────────────────────────────────────────────────
  debate:
    max_rounds: 2           # Paper: R=2 is optimal (Section 3.2.2)
    num_agents: 2           # 2 agents with opposing stances
    temperature: 0.0        # Deterministic output

  # ── Guidelines (theo viOCD Paper Section 3.1) ───────────────────────────
  # Hoàn toàn tiếng Việt
  guidelines: |
    <huong_dan>
    ĐỊNH NGHĨA CHÍNH XÁC (theo viOCD Paper):

    Nhãn 1 (PHÀN NÀN): Review THỂ HIỆN SỰ KHÔNG HÀI LÒNG giữa thực tế và kỳ vọng,
    kèm theo MONG MUỐN ĐƯỢC GIẢI QUYẾT. Có thể bao gồm cảnh báo, đe dọa,
    đề xuất, hoặc lời khuyên. PHẢI MANG TÍNH XÂY DỰNG, không phải chửi bới.

    Nhãn 0 (KHÔNG PHÀN NÀN): Khen ngợi, ca ngợi, thể hiện sự hài lòng,
    HOẶC công kích/chửi mắng mà KHÔNG CÓ mục đích xây dựng (không đề xuất gì).

    VÍ DỤ MINH HỌA:

    1. "Tôi rất hài lòng với sản phẩm, cảm ơn shop. Mong shop phát triển tốt hơn." → Nhãn 0
       (Câu cuối là MONG MUỐN NHƯNG KHÔNG gắn với sự không hài lòng. Chỉ là lời chúc tốt đẹp.)

    2. "Hàng rất tốt nhưng giá đắt vì giao hàng quá lâu." → Nhãn 1
       (Kết hợp khen + phàn nàn rõ ràng về giá và giao hàng → phàn nàn)

    3. "Không hiểu lý do gì mà lừa đảo vậy?" → Nhãn 1
       (Câu hỏi mang tính PHÀN NÀN/cảnh báo người khác)

    4. "Game dở lắm, đừng tải game này." → Nhãn 0
       (Công kích + cảnh báo nhưng KHÔNG có mục đích xây dựng, chỉ nói xấu)

    5. "Tôi đã dùng 5 chai nước tẩy trang mà vẫn hài lòng." → Nhãn 0
       (Khen ngợi, hài lòng)

    QUY TẮC QUAN TRỌNG:
    - Mục đích xây dựng là BẮT BUỘC cho Nhãn 1: phải có đề xuất/cảnh báo có ích
    - Công kích/chửi mắng không kèm đề xuất = Nhãn 0
    - Lời chúc/mong muốn tốt đẹp chung chung KHÔNG phải phàn nàn (Nhãn 0)
    - Không đánh giá tính đúng đắn, chỉ đánh giá MỤC ĐÍCH của người viết
    - Đánh giá toàn bộ review
    </huong_dan>

  # ── Agent System Messages ────────────────────────────────────────────────

  # Agent A: Ủng hộ phàn nàn (ban đầu: Nhãn 1)
  agent_complaint_system: |
    Bạn là Agent_A - chuyên gia phân tích phàn nàn trong review tiếng Việt.
    Nhiệm vụ: Xác định review là PHÀN NÀN (Nhãn 1) hay KHÔNG PHÀN NÀN (Nhãn 0).
    Có một Agent khác là Agent_B cùng thực hiện nhiệm vụ này.
    Hai agent sẽ tranh luận với nhau để đi đến thống nhất.
    {guidelines}
    Bạn có thể giữ hoặc THAY ĐỔI quan điểm ban đầu nếu bị thuyết phục.

  # Agent B: Ủng hộ không phàn nàn (ban đầu: Nhãn 0)
  agent_non_complaint_system: |
    Bạn là Agent_B - chuyên gia phân tích phàn nàn trong review tiếng Việt.
    Nhiệm vụ: Xác định review là PHÀN NÀN (Nhãn 1) hay KHÔNG PHÀN NÀN (Nhãn 0).
    Có một Agent khác là Agent_A cùng thực hiện nhiệm vụ này.
    Hai agent sẽ tranh luận với nhau để đi đến thống nhất.
    {guidelines}
    Bạn có thể giữ hoặc THAY ĐỔI quan điểm ban đầu nếu bị thuyết phục.

  # ── User Prompt Templates ────────────────────────────────────────────────

  # Vòng đầu tiên
  agent_user_template: |
    Review cần phân tích:
    {review}

    Nhiệm vụ: Xác định review trên là PHÀN NÀN (Nhãn 1) hay KHÔNG PHÀN NÀN (Nhãn 0).

    Quan điểm hiện tại của bạn: Nhãn {stance}
    - Nhãn 1 = PHÀN NÀN: thể hiện sự không hài lòng, đề xuất, mong muốn, cảnh báo
    - Nhãn 0 = KHÔNG PHÀN NÀN: chỉ khen ngợi, hài lòng, hoặc chửi mắng không có đề xuất

    Hướng dẫn: {guidelines}

    Phân tích review và đưa ra quyết định. Bạn có thể giữ hoặc THAY ĐỔI quan điểm hiện tại nếu phân tích cho thấy quan điểm khác đúng hơn.

    Trả lời theo mẫu Pydantic: evidence (trích dẫn từ review), argument (lập luận), label (0 hoặc 1).

  # Các vòng tiếp theo
  agent_roundN_template: |
    Review cần phân tích:
    {review}

    Lịch sử tranh luận từ vòng trước:
    {history}

    Nhiệm vụ: Xác định review trên là PHÀN NÀN (Nhãn 1) hay KHÔNG PHÀN NÀN (Nhãn 0).

    Quan điểm hiện tại của bạn: Nhãn {stance}
    - Nhãn 1 = PHÀN NÀN: thể hiện sự không hài lòng, đề xuất, mong muốn, cảnh báo
    - Nhãn 0 = KHÔNG PHÀN NÀN: chỉ khen ngợi, hài lòng, hoặc chửi mắng không có đề xuất

    Hướng dẫn: {guidelines}

    Đọc lịch sử tranh luận, phản bác hoặc thừa nhận lập luận của Agent kia.
    Bạn có thể giữ hoặc THAY ĐỔI quan điểm hiện tại nếu bị thuyết phục.

    Trả lời theo mẫu Pydantic: evidence (trích dẫn từ review), argument (lập luận có tham chiếu đến lịch sử), label (0 hoặc 1).

  # ── Thẩm phán (khi hai Agent không đồng ý) ─────────────────────────────

  adjudicator_system: |
    Bạn là THẨM PHÁN - chuyên gia phân tích phàn nàn trong review tiếng Việt.
    Nhiệm vụ: Đọc lịch sử tranh luận giữa hai Agent và đưa ra quyết định cuối cùng.
    {guidelines}
    Đánh giá chất lượng lập luận của từng Agent, sau đó đưa ra quyết định của riêng bạn.
    Confidence: mức độ chắc chắn của quyết định (0.0-1.0).

  adjudicator_user_template: |
    Review cần phân tích:
    {review}

    Lịch sử tranh luận giữa hai Agent:
    {history}

    Hai Agent không đồng ý với nhau. Bạn là Thẩm Phán, hãy đọc lịch sử tranh luận,
    đánh giá lập luận của từng Agent, và đưa ra quyết định cuối cùng.

    Hướng dẫn: {guidelines}

    Trả lời theo mẫu Pydantic: final_label (0 hoặc 1), confidence (0.0-1.0), reasoning (lập luận).

  # ── LLM Settings for DREAM ───────────────────────────────────────────
  llm:
    temperature: 0.0  # DREAM uses deterministic output
    max_tokens: 4096

  # ── Human Escalation (DREAM Paper Section 3.1) ─────────────────────────
  # If agents STILL disagree after max_rounds, escalate to human
  # Human annotator receives: review + debate history (both agents' reasoning & evidence)
  # This helps understand the source of disagreement for better judgment
  escalation:
    enabled: true           # Enable escalation for disagreements
    use_llm_adjudicator: true  # True = use LLM adjudicator first
                               # If confidence < threshold, escalate to human
    adjudicator_model: null  # Use same model as agents if null
    export_file: "data/escalated_for_human.csv"  # File to export cases needing human review
    confidence_threshold: 0.7  # If adjudicator confidence < threshold, escalate to human

# ---------------------------------------------------------------------------
# Legacy MADISSE config (kept for backward compatibility)
# ---------------------------------------------------------------------------
madisse:
  enabled: false  # Disabled, using DREAM instead

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
