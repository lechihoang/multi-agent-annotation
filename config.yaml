nvidia:
  model: qwen/qwen3-next-80b-a3b-instruct
  base_url: https://integrate.api.nvidia.com/v1
  max_tokens: 2048
  max_retries: 8
  rate_limit: 40
task:
  name: victsd_constructiveness
  text_column: Comment
  label_column: Constructiveness
  labels:
    '0': Non-constructive — Simple emotions, well-wishes, or generic reactions without
      specific information or opinion
    '1': Constructive — Provides specific viewpoint, information, analysis, or meaningful
      contribution to the topic
dream:
  debate:
    max_rounds: 2
  guidelines: '<guidelines>

    TASK: Classify Vietnamese social media comments as Constructive (1) or Non-constructive
    (0) based on the ViCTSD dataset guidelines.


    Label 1 (Constructive):

    - The comment provides lots of information and particularized opinions.

    - It contributes to promoting the topic and reinforces a specific point of view.

    - Constructive comments are typically longer and detailed, offering substance
    beyond mere reaction.


    Label 0 (Non-constructive):

    - The comment has little information.

    - It is only about expressing simple emotions (e.g., pure praise, anger, sympathy)
    and does not have much analytical meaning.

    - Vague reactions, short exclamations, or generic well-wishes fall here.


    CRITICAL RULES:

    1. Ask: "Does this comment provide specific information/opinions that promote
    the topic?"

    2. If it is just an emotional exclamation (even using specific nouns) with little
    informational value, it is 0.

    3. Quote the DECISIVE phrase showing the presence or lack of information.

    4. Keep reasoning concise (max ~90 words).

    </guidelines>

    '
  agent_a_system: 'You are a Vietnamese language expert specializing in constructive
    speech detection.

    Your task: classify social media comments as Constructive (1) or Non-constructive
    (0).

    You will critically analyze the text, leaning towards identifying Constructive
    (1) elements if present.


    {guidelines}

    '
  agent_b_system: 'You are a Vietnamese language expert specializing in constructive
    speech detection.

    Your task: classify social media comments as Constructive (1) or Non-constructive
    (0).

    You will critically analyze the text, leaning towards identifying Non-constructive
    (0) elements if present.


    {guidelines}

    '
  agent_user_template: 'Task: Classify the following Vietnamese social media comment.


    Comment:

    {text}


    Options:

    {labels}


    Your current position: {stance}

    Analyze the comment carefully and decide the correct label.

    Quote the decisive phrase from the comment as evidence.

    Keep your argument concise (max ~90 words).


    Respond with: label (0 or 1), evidence, argument.

    '
  agent_roundN_template: 'Task: Classify the following Vietnamese social media comment.


    Comment:

    {text}


    Options:

    {labels}


    Your current position: {stance}


    Previous debate rounds:

    {history}


    Read the debate history carefully and critically evaluate the opposing agent''s
    arguments.

    - Rebut flaws in their reasoning or acknowledge if they provide a genuinely better
    reasoning path.

    - DO NOT just agree to reach a consensus. Only revise your label if the opposing
    evidence is undeniably stronger.

    - Update or defend your position based on the evidence.


    Quote specific evidence from the comment to support your reasoning.

    Keep your argument concise (max ~90 words).


    Respond with: label (0 or 1), evidence, argument.

    '
  moderator:
    enabled: true
    system: 'You are a decisive moderator reviewing a debate about Vietnamese social
      media comment classification.

      Your task is to identify the main points of disagreement between the two debating
      agents.

      Do not absorb their biases. Objectively summarize: (1) what they agree on, (2)
      the core logical conflict in their disagreement.

      '
    user_template: 'Comment: {text}


      Debate history:

      {history}


      Summarize the key points of disagreement and areas of agreement.

      '
  adjudicator:
    temperature: 0.0
    max_tokens: 1024
    system: 'You are the Adjudicator — a neutral, decisive expert making the final
      decision.

      Evaluate the debate history and the comment objectively. Do not flip-flop.

      Rely heavily on the Core Principles and Critical Rules in the guidelines.


      {guidelines}

      '
    user_template: 'Comment to classify:

      {text}


      Label definitions:

      {labels}


      Debate history:

      {history}


      Moderator notes: {moderator_notes}


      Make the final decision. Respond with: final_label (0 or 1), confidence (0.0-1.0),
      reasoning.

      Keep reasoning concise (max ~120 words).

      '
  escalation:
    mode: fully_automatic
    export_file: data/victsd_escalated.csv
  llm:
    temperature: 0.0
    max_tokens: 1024
logging:
  level: INFO
