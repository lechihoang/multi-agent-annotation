# =============================================================================
# DREAM: Debate-based RElevance Assessment with Multi-agents
# Based on: arXiv:2602.06526 - Completing Missing Annotation
#
# Prompt design adapted from paper for Vietnamese complaint detection.
# Output uses Pydantic (not JSON) for structured parsing.
# =============================================================================

# ---------------------------------------------------------------------------
# LLM Provider (NVIDIA NIM - compatible with OpenAI SDK)
# ---------------------------------------------------------------------------
nvidia:
  model: "meta/llama-3.3-70b-instruct"
  base_url: "https://integrate.api.nvidia.com/v1"
  temperature: 0.0  # DREAM uses temperature=0.0 for deterministic output
  top_p: 0.7
  max_tokens: 2048
  stream: false
  max_retries: 5
  rate_limit: 40  # requests per minute

# ---------------------------------------------------------------------------
# Task Definition
# ---------------------------------------------------------------------------
task:
  name: "complaint_detection"
  text_column: "review"
  label_column: "label"

  labels:
    "0": "Non-complaint — Pure praise, satisfaction, OR insult/hate speech WITHOUT constructive intent."
    "1": "Complaint — Dissatisfaction, suggestion, wish, warning, OR mixed (praise+criticism) WITH constructive intent."

# ---------------------------------------------------------------------------
# DREAM Configuration (Multi-Agent Debate)
# ---------------------------------------------------------------------------
dream:
  enabled: true

  # ── Debate Parameters ─────────────────────────────────────────────────
  debate:
    max_rounds: 2           # Paper: R=2 is optimal (Section 3.2.2)
    num_agents: 2           # 2 agents with opposing stances
    temperature: 0.0        # Deterministic output

  # ── Guidelines (adapted from paper Table 27) ─────────────────────────
  # 8 criteria adapted for Vietnamese complaint detection
  guidelines: |
    <guide>
    1. Label 1 (COMPLAINT): Review thể hiện sự không hài lòng (dissatisfaction), đề xuất cải thiện (suggestion), mong muốn (wish), hoặc cảnh báo (warning).

    2. Label 0 (NON-COMPLAINT): Review chỉ khen ngợi thuần túy, thể hiện sự hài lòng (satisfaction) HOẶC chỉ là insult/hate speech không có constructive intent.

    3. Đánh giá DỰA TRÊN NỘI DUNG: Có constructive intent (đề xuất, phàn nàn, mong muốn, cảnh báo) mới là Label 1.

    4. Mixed content (khen + chê): Xem xét có constructive intent không? Nếu CÓ → Label 1.

    5. Không đánh giá tính đúng đắn của nội dung, chỉ đánh giá intent.

    6. Câu hỏi hoặc câu trả lời không phải complaint trừ khi thể hiện mong muốn/đề xuất cụ thể.

    7. Đánh giá ĐỘC LẬP từng câu trong review.

    8. Quyết định dựa trên nội dung review, không dựa trên surface-level similarity.
    </guide>

  # ── Agent System Messages (adapted from paper Table 27) ───────────────

  # Agent 1: Pro-Complaint (Initial stance: Label 1)
  agent_complaint_system: |
    Bạn là Agent_Complaint - chuyên gia phân tích complaint trong review tiếng Việt.
    Nhiệm vụ: Xác định review có phải là COMPLAINT (Label 1) hay không (Label 0).
    Có một Agent khác là Agent_NonComplaint cùng thực hiện nhiệm vụ này.
    Hai agent sẽ tranh luận với nhau để đi đến thống nhất.
    {guidelines}
    Bạn có thể giữ hoặc THAY ĐỔI stance ban đầu nếu bị thuyết phục.

  # Agent 2: Pro-Non-Complaint (Initial stance: Label 0)
  agent_non_complaint_system: |
    Bạn là Agent_NonComplaint - chuyên gia phân tích complaint trong review tiếng Việt.
    Nhiệm vụ: Xác định review có phải là COMPLAINT (Label 1) hay không (Label 0).
    Có một Agent khác là Agent_Complaint cùng thực hiện nhiệm vụ này.
    Hai agent sẽ tranh luận với nhau để đi đến thống nhất.
    {guidelines}
    Bạn có thể giữ hoặc THAY ĐỔI stance ban đầu nếu bị thuyết phục.

  # ── User Prompt Templates (adapted from paper) ─────────────────────────

  # First round prompt - adapted from paper Table 27
  agent_user_template: |
    Review cần phân tích:
    {review}

    Nhiệm vụ: Xác định review trên là COMPLAINT (Label 1) hay NON-COMPLAINT (Label 0).

    Stance hiện tại của bạn: Label {stance}
    - Label 1 = COMPLAINT: thể hiện sự không hài lòng, đề xuất, mong muốn, cảnh báo
    - Label 0 = NON-COMPLAINT: chỉ khen ngợi, hài lòng, hoặc insult không có constructive intent

    Hướng dẫn: {guidelines}

    Phân tích review và đưa ra quyết định. Bạn có thể giữ hoặc THAY ĐỔI stance hiện tại nếu phân tích cho thấy stance khác đúng hơn.

    Trả lời theo mẫu Pydantic: evidence (trích dẫn từ review), argument (lập luận), label (0 hoặc 1).

  # Subsequent rounds prompt - adapted from paper Table 28
  agent_roundN_template: |
    Review cần phân tích:
    {review}

    Lịch sử tranh luận từ vòng trước:
    {history}

    Nhiệm vụ: Xác định review trên là COMPLAINT (Label 1) hay NON-COMPLAINT (Label 0).

    Stance hiện tại của bạn: Label {stance}
    - Label 1 = COMPLAINT: thể hiện sự không hài lòng, đề xuất, mong muốn, cảnh báo
    - Label 0 = NON-COMPLAINT: chỉ khen ngợi, hài lòng, hoặc insult không có constructive intent

    Hướng dẫn: {guidelines}

    Đọc lịch sử tranh luận, phản bác hoặc thừa nhận lập luận của Agent kia.
    Bạn có thể giữ hoặc THAY ĐỔI stance hiện tại nếu bị thuyết phục.

    Trả lời theo mẫu Pydantic: evidence (trích dẫn từ review), argument (lập luận có tham chiếu đến lịch sử), label (0 hoặc 1).

  # ── Adjudicator Prompt (adapted from paper Table 29) ───────────────────

  adjudicator_system: |
    Bạn là THẨM PHÁN - chuyên gia phân tích complaint trong review tiếng Việt.
    Nhiệm vụ: Đọc lịch sử tranh luận giữa hai Agent và đưa ra quyết định cuối cùng.
    {guidelines}
    Đánh giá chất lượng lập luận của từng Agent, sau đó đưa ra quyết định của riêng bạn.
    Confidence: mức độ chắc chắn của quyết định (0.0-1.0).

  adjudicator_user_template: |
    Review cần phân tích:
    {review}

    Lịch sử tranh luận giữa hai Agent:
    {history}

    Hai Agent không đồng ý với nhau. Bạn là Thẩm Phán, hãy đọc lịch sử tranh luận,
    đánh giá lập luận của từng Agent, và đưa ra quyết định cuối cùng.

    Hướng dẫn: {guidelines}

    Trả lời theo mẫu Pydantic: final_label (0 hoặc 1), confidence (0.0-1.0), reasoning (lập luận).

  # ── LLM Settings for DREAM ───────────────────────────────────────────
  llm:
    temperature: 0.0  # DREAM uses deterministic output
    max_tokens: 4096

  # ── Human Escalation ──────────────────────────────────────────────────
  # DREAM: If agents disagree after max_rounds, escalate to human
  # with debate history as supportive resource
  escalation:
    enabled: true           # Enable human escalation for disagreements
    use_llm_adjudicator: true  # Use LLM as adjudicator instead of human (faster)
    adjudicator_model: null  # Use same model as agents if null

# ---------------------------------------------------------------------------
# Legacy MADISSE config (kept for backward compatibility)
# ---------------------------------------------------------------------------
madisse:
  enabled: false  # Disabled, using DREAM instead

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
